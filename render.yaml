# Render "Blueprint": New > Blueprint > pick github.com/Abheeshek-47/Gaurdian-pulse-app.
# The server files (main.py, Dockerfile) sit at the repo root, so no rootDir is needed.
services:
  - type: web
    name: guardianpulse-webhook
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CARETAKER_KEY
        generateValue: true
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false   # paste the whole service-account JSON in the Render dashboard
